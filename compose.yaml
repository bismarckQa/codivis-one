name: codivis-one

services:
  backend:
    container_name: codivis-one-backend
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      TOKEN_PEPPER: ${TOKEN_PEPPER:?TOKEN_PEPPER is required}
      LICENSE_PUBLIC_KEY_PATH: /run/license-public/codivis-one-ed25519.pub
      LICENSE_PUBLIC_KEY_SHA256: ${LICENSE_PUBLIC_KEY_SHA256:-}
    depends_on:
      codivis-one-postgres:
        condition: service_healthy
    volumes:
      - ${LICENSE_PUBLIC_KEY_FILE:?LICENSE_PUBLIC_KEY_FILE is required}:/run/license-public/codivis-one-ed25519.pub:ro
      - codivis_one_activation_data:/data/activation
    expose: ["8000"]
    restart: unless-stopped

  frontend:
    container_name: codivis-one-frontend
    build: ./frontend
    expose: ["80"]
    restart: unless-stopped

  redis:
    container_name: codivis-one-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - codivis_one_redis_data:/data
    restart: unless-stopped

  api:
    container_name: codivis-one-api
    image: nginx:1.27-alpine
    depends_on: [backend, frontend]
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./api/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  codivis-one-postgres:
    container_name: codivis-one-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55434}:5432"
    volumes:
      - codivis_one_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  codivis_one_postgres_data:
  codivis_one_redis_data:
  codivis_one_activation_data:
